spring.application.name=gymflex-backend
server.port=8080

# ====================== DATABASE (MySQL) ======================
# 1) Make sure MySQL is running.
# 2) Change the username/password below to YOUR MySQL login.
# The database "gymflex" is created automatically (createDatabaseIfNotExist=true).
spring.datasource.url=jdbc:mysql://localhost:3306/gymflex?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# >>>>>>>>>>  ENTER YOUR MYSQL PASSWORD ON THE NEXT LINE  <<<<<<<<<<
spring.datasource.password=YOUR_PASSWORD

# ====================== JPA / HIBERNATE ======================
# "update" creates/updates tables automatically (fine for a college project).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ====================== GYMFLEX SETTINGS ======================
# Frontend origins allowed to call this API (comma separated, NO spaces).
gymflex.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
# Insert sample plans/members/memberships/check-ins when the tables are empty.
gymflex.seed.enabled=true
